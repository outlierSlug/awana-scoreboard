# Render blueprint for the API. The frontend is on Cloudflare Pages and is not
# described here.

services:
  - type: web
    name: awana-api
    runtime: docker
    region: oregon          # Closest region to Seattle.
    plan: starter           # $7/mo. The free plan spins down after inactivity,
                            # which would mean a cold start at 7:15pm on a
                            # Friday with a room full of kids waiting.
    rootDir: apps/api
    dockerfilePath: ./Dockerfile

    # Render polls this to decide whether a deploy succeeded and whether the
    # instance is healthy. It returns a static payload and never touches the
    # database, so a slow query cannot turn into a restart loop.
    healthCheckPath: /api/health

    # MUST stay 1.
    #
    # SignalR keeps connection and group state in the memory of the instance
    # that holds the socket. With two instances, a scoreboard connected to
    # instance A never receives a broadcast triggered by a request that landed
    # on instance B, and the board silently stops updating with no error
    # anywhere. Scaling past one requires a Redis backplane first.
    numInstances: 1

    autoDeploy: true

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # Neon POOLED connection string, used by the app at runtime.
      # Must include Max Auto Prepare=0: Neon fronts Postgres with PgBouncer in
      # transaction mode, which is incompatible with Npgsql's automatic
      # prepared statements, and the failure is intermittent and confusing.
      - key: ConnectionStrings__Default
        sync: false

      # Neon DIRECT connection string, used only for migrations. DDL must not
      # run through the pooler.
      #
      # The key is Database__MigrationsConnectionString, not
      # ConnectionStrings__Migrations. DatabaseInitializer reads this off
      # DatabaseOptions, whose section is "Database", so the ConnectionStrings
      # spelling binds to nothing: migrations would fall back to the pooled
      # connection and hit exactly the PgBouncer failure this exists to avoid.
      # (ConnectionStrings__Migrations IS the right name for the design-time
      # factory that `dotnet ef` uses, which is why the two look alike. That
      # path never runs on Render.)
      - key: Database__MigrationsConnectionString
        sync: false

      # Lets migrations be turned off from the dashboard without a redeploy
      # when something goes wrong at a bad moment. Same section prefix, for the
      # same reason: without it this reads as false-but-ignored, and the switch
      # would appear to work while migrations kept running.
      - key: Database__RunMigrationsOnStartup
        value: "true"

      # Allowed browser origins. The double underscore is how .NET configuration
      # reads nested keys from environment variables, and the trailing index
      # binds an array element.
      - key: Cors__AllowedOrigins__0
        sync: false

      # Google OAuth. Set in the Render dashboard, never committed.
      - key: Authentication__Google__ClientId
        sync: false
      - key: Authentication__Google__ClientSecret
        sync: false

      # Seeded role allowlists, comma separated. Unknown emails are refused
      # rather than auto-created.
      - key: Seed__AdminEmails
        sync: false
      - key: Seed__GamesLeaderEmails
        sync: false
      - key: Seed__ScorekeeperEmails
        sync: false

      # Seed__ChurchSlug is deliberately NOT set.
      #
      # It defaults to "church", and the public home page asks for that exact
      # slug, hardcoded, because v1 ships configured for one church. Setting it
      # to something truer like "eccs" would leave the API answering correctly
      # and the home page listing nothing, with no error anywhere. Change both
      # or neither.
      #
      # Seed__ChurchName is safe to set: it is a display name, not a URL.
      - key: Seed__ChurchName
        sync: false
