<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: oklch(0.205 0 0); } a:hover { color: oklch(0.145 0 0); }
    button { font: inherit; cursor: pointer; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: oklch(1 0 0); color: oklch(0.145 0 0); overflow: hidden;">

  <!-- Session bar. Full date, because a scorekeeper opening this on a phone
       should never have to guess which night they are recording. -->
  <div style="flex-shrink: 0; border-bottom: 1px solid oklch(0.922 0 0); padding: 12px 16px 10px;">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;">
      <div style="min-width: 0;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 17px; font-weight: 700; letter-spacing: -0.01em;">T&amp;T Games</span>
          <span style="display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; background: color-mix(in oklch, #22c55e, transparent 88%); color: #15803d; font-size: 11px; font-weight: 700; letter-spacing: 0.02em;">RECORDING</span>
        </div>
        <div style="font-size: 13px; color: oklch(0.556 0 0); margin-top: 3px;">Friday, October 2, 2026</div>
      </div>
      <button style="height: 38px; padding: 0 11px; border-radius: 11px; border: 1px solid oklch(0.922 0 0); background: oklch(1 0 0); font-size: 13px; font-weight: 600; color: oklch(0.145 0 0); display: flex; align-items: center; gap: 6px; flex-shrink: 0;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="M7 14l4-4 3 3 5-6"></path></svg>
        <span>History</span>
      </button>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: oklch(0.556 0 0);">
      <span style="font-weight: 600; color: oklch(0.145 0 0);">Round 4</span>
      <span>&middot;</span>
      <span>3 recorded, 1 voided</span>
      <span style="margin-left: auto; display: inline-flex; align-items: center; gap: 5px;">
        <span style="width: 7px; height: 7px; border-radius: 999px; background: #22c55e; display: block;"></span>
        Board connected
      </span>
    </div>
  </div>

  <!-- Game and round configuration -->
  <div style="margin: 12px 16px 0; border-radius: 16px; background: oklch(0.97 0 0); padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0;">
    <button style="display: flex; align-items: center; gap: 7px; border: none; background: none; padding: 0; color: oklch(0.145 0 0);">
      <span style="font-size: 15px; font-weight: 600;">Baton Relay</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="oklch(0.556 0 0)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <div style="display: flex; gap: 3px; background: oklch(1 0 0); border-radius: 10px; padding: 3px;">
      <button onClick="{{setX1}}" style="{{x1Style}}">&times;1</button>
      <button onClick="{{setX2}}" style="{{x2Style}}">&times;2</button>
    </div>
  </div>

  <!-- Team blocks -->
  <div style="padding: 13px 16px 10px; flex-shrink: 0;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 9px;">
      <span style="{{tapLabelStyle}}">{{tapLabel}}</span>
      <button onClick="{{toggleTie}}" style="{{tieArmStyle}}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11l5-5 5 5"></path><path d="M7 18l5-5 5 5"></path></svg>
        <span>{{tieArmLabel}}</span>
      </button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <sc-for list="{{teams}}" as="team" hint-placeholder-count="4">
        <button onClick="{{team.tap}}" style="{{team.buttonStyle}}">
          <span style="{{team.rankStyle}}">{{team.rank}}</span>
          <span style="font-size: 19px; font-weight: 700; letter-spacing: -0.01em;">{{team.name}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <!-- Finish order -->
  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; flex-shrink: 0;">
      <span style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: oklch(0.556 0 0); font-weight: 600;">Finish order</span>
      <button onClick="{{clear}}" style="{{clearStyle}}">Clear</button>
    </div>

    <div style="flex-grow: 1; min-height: 0; overflow-y: auto;">
      <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
        <div style="border: 1px dashed oklch(0.922 0 0); border-radius: 16px; padding: 20px 16px; text-align: center; color: oklch(0.556 0 0); font-size: 13px; line-height: 1.5;">
          Nothing recorded yet.<br>Tap a team as it crosses the line.
        </div>
      </sc-if>

      <div style="display: flex; flex-direction: column; gap: 7px;">
        <sc-for list="{{rows}}" as="row" hint-placeholder-count="2">
          <div style="border: 1px solid oklch(0.922 0 0); border-radius: 16px; padding: 9px 10px;">
            <div style="display: flex; align-items: center; gap: 9px;">
              <div style="width: 26px; flex-shrink: 0; font-size: 12px; font-weight: 700; color: oklch(0.556 0 0);">{{row.rank}}</div>
              <div style="display: flex; flex-wrap: wrap; gap: 4px; flex-grow: 1; min-width: 0;">
                <sc-for list="{{row.members}}" as="m" hint-placeholder-count="1">
                  <span style="{{m.pillStyle}}">{{m.label}}</span>
                </sc-for>
              </div>
              <div style="font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums;">{{row.points}}</div>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px;">
              <button onClick="{{row.up}}" style="{{row.upStyle}}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path></svg>
              </button>
              <button onClick="{{row.down}}" style="{{row.downStyle}}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M19 12l-7 7-7-7"></path></svg>
              </button>
              <sc-if value="{{row.canTie}}" hint-placeholder-val="{{true}}">
                <button onClick="{{row.tie}}" style="{{row.chipStyle}}">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11l5-5 5 5"></path><path d="M7 18l5-5 5 5"></path></svg>
                  <span>Tie up</span>
                </button>
              </sc-if>
              <sc-for list="{{row.members}}" as="m" hint-placeholder-count="1">
                <button onClick="{{m.dq}}" style="{{m.dqStyle}}">{{m.dqLabel}}</button>
              </sc-for>
              <sc-for list="{{row.members}}" as="m" hint-placeholder-count="1">
                <button onClick="{{m.bonus}}" style="{{m.bonusStyle}}">{{m.bonusLabel}}</button>
              </sc-for>
              <sc-for list="{{row.members}}" as="m" hint-placeholder-count="1">
                <button onClick="{{m.remove}}" style="{{m.removeStyle}}">{{m.removeLabel}}</button>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <!-- Preview and the authoritative push -->
  <div style="flex-shrink: 0; margin: 10px 16px 16px; border-radius: 18px; border: 1px solid oklch(0.922 0 0); overflow: hidden;">
    <div style="padding: 11px 13px 12px;">
      <div style="display: flex; justify-content: space-between; gap: 6px; margin-bottom: 8px;">
        <sc-for list="{{preview}}" as="p" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex-grow: 1;">
            <span style="{{p.dotStyle}}"></span>
            <span style="{{p.valueStyle}}">{{p.value}}</span>
          </div>
        </sc-for>
      </div>
      <div style="font-size: 12px; line-height: 1.45; color: oklch(0.371 0 0);">{{reasoning}}</div>
    </div>

    <div style="border-top: 1px solid oklch(0.922 0 0); padding: 10px; display: flex; gap: 8px;">
      <button onClick="{{undo}}" style="{{undoStyle}}">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-15-6.7L3 13"></path></svg>
        <span>Undo</span>
      </button>
      <button style="{{confirmStyle}}">{{confirmLabel}}</button>
    </div>

    <div style="padding: 0 13px 11px; font-size: 11px; color: oklch(0.556 0 0); text-align: center;">{{footnote}}</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const TABLE = [40, 30, 20, 10];
const BONUS_STEPS = [0, 10, 20];

const TEAMS = [
  { id: 'red',    name: 'Red',    color: '#dc2626', fg: '#ffffff' },
  { id: 'blue',   name: 'Blue',   color: '#2563eb', fg: '#ffffff' },
  { id: 'yellow', name: 'Yellow', color: '#facc15', fg: '#111827' },
  { id: 'green',  name: 'Green',  color: '#15803d', fg: '#ffffff' },
];

const ORDINALS = ['1st', '2nd', '3rd', '4th', '5th', '6th'];

const CHIP =
  'height: 38px; padding: 0 11px; border-radius: 11px; font-size: 13px; font-weight: 500;' +
  'display: inline-flex; align-items: center; gap: 5px;';

const ICON_CHIP =
  'width: 38px; height: 38px; border-radius: 11px; display: inline-flex;' +
  'align-items: center; justify-content: center;';

/* Whole numbers on screen. With the official 40/30/20/10 table every possible
   split is already an integer: two-way ties give 35, 25 or 15, three-way give
   30 or 20, four-way gives 25. So nothing is lost by hiding the decimals, and
   the precision is a configurable setting rather than a hardcoded format. */
function fmt(n) {
  return String(Math.round(n));
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      groups: [['yellow'], ['blue']],
      dq: [],
      bonus: {},
      multiplier: 1,
      past: [],
      tieInto: null,
      tieArmed: false,
    };
  }

  teamById(id) { return TEAMS.find((t) => t.id === id); }

  placedIds() { return this.state.groups.flat(); }

  snapshot() {
    const s = this.state;
    return {
      groups: s.groups.map((g) => g.slice()),
      dq: s.dq.slice(),
      bonus: Object.assign({}, s.bonus),
      multiplier: s.multiplier,
    };
  }

  commit(next) {
    const past = this.state.past.slice(-19);
    past.push(this.snapshot());
    this.setState(Object.assign({ past: past }, next));
  }

  computeAwards() {
    const s = this.state;
    const awards = {};
    let cursor = 1;

    s.groups.forEach((group) => {
      let sum = 0;
      for (let i = 0; i < group.length; i++) sum += TABLE[cursor - 1 + i] ?? 0;
      const share = sum / group.length;

      group.forEach((id) => {
        const placement = s.dq.indexOf(id) >= 0 ? 0 : share * s.multiplier;
        awards[id] = placement + (s.bonus[id] ?? 0);
      });

      cursor += group.length;
    });

    return awards;
  }

  reasoningText() {
    const s = this.state;
    if (s.groups.length === 0) return 'Tap a team to begin. Nothing is sent yet.';

    let cursor = 1;
    const lines = [];

    s.groups.forEach((group) => {
      const slots = [];
      for (let i = 0; i < group.length; i++) slots.push(TABLE[cursor - 1 + i] ?? 0);
      const sum = slots.reduce((a, b) => a + b, 0);

      if (group.length > 1) {
        const names = group.map((id) => this.teamById(id).name).join(' and ');
        lines.push(
          names + ' tied for ' + ORDINALS[cursor - 1] + '. Places ' +
          slots.map((_, i) => ORDINALS[cursor - 1 + i]).join(' and ') +
          ' share ' + slots.join(' + ') + ' = ' + sum + ', split ' +
          group.length + ' ways, ' + fmt(sum / group.length) + ' each.'
        );
      }

      group.forEach((id) => {
        if (s.dq.indexOf(id) >= 0) {
          lines.push(this.teamById(id).name + ' disqualified. Keeps its place, scores 0, nobody moves up.');
        }
      });

      cursor += group.length;
    });

    if (s.multiplier !== 1) lines.push('Double round, so placement points are doubled. Bonuses are not.');

    Object.keys(s.bonus).forEach((id) => {
      if (s.bonus[id] > 0) lines.push(this.teamById(id).name + ' earned a ' + s.bonus[id] + ' point bonus.');
    });

    if (lines.length === 0) return 'Clean finish, no ties. Points follow the table directly.';
    return lines.join(' ');
  }

  blockingReason() {
    if (this.state.groups.length === 0) return 'Place at least one team';
    const missing = TEAMS.filter((t) => this.placedIds().indexOf(t.id) < 0);
    if (missing.length > 0) return 'Waiting on ' + missing.map((t) => t.name).join(', ');
    return null;
  }

  swap(a, b) {
    const groups = this.state.groups.map((g) => g.slice());
    const held = groups[a];
    groups[a] = groups[b];
    groups[b] = held;
    this.commit({ groups: groups });
  }

  renderVals() {
    const self = this;
    const s = this.state;
    const awards = this.computeAwards();
    const placed = this.placedIds();
    const blocking = this.blockingReason();
    const canUndo = s.past.length > 0;

    const segStyle = (on) =>
      'height: 28px; min-width: 38px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600;' +
      (on
        ? 'background: oklch(0.205 0 0); color: oklch(0.985 0 0);'
        : 'background: transparent; color: oklch(0.556 0 0);');

    const iconStyle = (enabled) =>
      ICON_CHIP + (enabled
        ? 'border: 1px solid oklch(0.922 0 0); background: oklch(1 0 0); color: oklch(0.371 0 0);'
        : 'border: 1px solid oklch(0.97 0 0); background: oklch(1 0 0); color: oklch(0.922 0 0); cursor: default;');

    const teams = TEAMS.map((t) => {
      const idx = placed.indexOf(t.id);
      const isPlaced = idx >= 0;

      return {
        name: t.name,
        rank: isPlaced ? String(idx + 1) : '',
        rankStyle:
          'min-height: 22px; font-size: 13px; font-weight: 700; opacity: 0.9;' +
          'display: flex; align-items: center; justify-content: center;' +
          (isPlaced ? 'width: 22px; border-radius: 999px; background: rgba(255,255,255,0.28);' : ''),
        buttonStyle:
          'height: 128px; border-radius: 20px; display: flex; flex-direction: column;' +
          'align-items: center; justify-content: center; gap: 6px;' +
          'background: ' + t.color + '; color: ' + t.fg + ';' +
          (isPlaced ? 'opacity: 0.34;' : '') +
          (s.tieArmed && !isPlaced
            ? 'border: 3px solid oklch(0.145 0 0);'
            : 'border: 3px solid transparent;'),
        tap: () => {
          if (isPlaced) return;

          if (s.tieArmed) {
            if (s.tieInto === null) {
              self.commit({ groups: s.groups.concat([[t.id]]), tieInto: s.groups.length });
            } else {
              const groups = s.groups.map((g) => g.slice());
              groups[s.tieInto].push(t.id);
              self.commit({ groups: groups });
            }
            return;
          }

          self.commit({ groups: s.groups.concat([[t.id]]) });
        },
      };
    });

    const rows = s.groups.map((group, gi) => {
      const canUp = gi > 0;
      const canDown = gi < s.groups.length - 1;

      return {
        rank: ORDINALS[gi],
        points: fmt(awards[group[0]]),
        canTie: gi > 0,
        chipStyle: CHIP + 'border: 1px solid oklch(0.922 0 0); background: oklch(1 0 0); color: oklch(0.371 0 0);',

        upStyle: iconStyle(canUp),
        downStyle: iconStyle(canDown),
        up: () => { if (canUp) self.swap(gi, gi - 1); },
        down: () => { if (canDown) self.swap(gi, gi + 1); },

        tie: () => {
          const groups = s.groups.map((g) => g.slice());
          const merged = groups[gi - 1].concat(groups[gi]);
          groups.splice(gi - 1, 2, merged);
          self.commit({ groups: groups });
        },

        members: group.map((id) => {
          const t = self.teamById(id);
          const isDq = s.dq.indexOf(id) >= 0;
          const bonusValue = s.bonus[id] ?? 0;

          return {
            label: t.name,
            pillStyle:
              'display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 9px;' +
              'font-size: 14px; font-weight: 700; background: ' + t.color + '; color: ' + t.fg + ';' +
              (isDq ? 'opacity: 0.4; text-decoration: line-through;' : ''),

            dqLabel: isDq ? 'Undo DQ' : 'DQ',
            dqStyle: CHIP + (isDq
              ? 'border: 1px solid oklch(0.577 0.245 27.325); background: oklch(1 0 0); color: oklch(0.577 0.245 27.325);'
              : 'border: 1px solid transparent; background: color-mix(in oklch, oklch(0.577 0.245 27.325), transparent 91%); color: oklch(0.577 0.245 27.325);'),
            dq: () => {
              const next = isDq ? s.dq.filter((x) => x !== id) : s.dq.concat([id]);
              self.commit({ dq: next });
            },

            bonusLabel: bonusValue > 0 ? 'Bonus +' + bonusValue : '+ Bonus',
            bonusStyle: CHIP + (bonusValue > 0
              ? 'border: 1px solid oklch(0.145 0 0); background: oklch(1 0 0); color: oklch(0.145 0 0);'
              : 'border: 1px solid oklch(0.922 0 0); background: oklch(1 0 0); color: oklch(0.556 0 0);'),
            bonus: () => {
              const nextIdx = (BONUS_STEPS.indexOf(bonusValue) + 1) % BONUS_STEPS.length;
              const bonus = Object.assign({}, s.bonus);
              bonus[id] = BONUS_STEPS[nextIdx];
              self.commit({ bonus: bonus });
            },

            removeLabel: 'Remove',
            removeStyle: CHIP + 'border: 1px solid oklch(0.922 0 0); background: oklch(1 0 0); color: oklch(0.556 0 0);',
            remove: () => {
              const groups = s.groups
                .map((g) => g.filter((x) => x !== id))
                .filter((g) => g.length > 0);
              const bonus = Object.assign({}, s.bonus);
              delete bonus[id];
              self.commit({ groups: groups, dq: s.dq.filter((x) => x !== id), bonus: bonus, tieInto: null });
            },
          };
        }),
      };
    });

    const preview = TEAMS.map((t) => {
      const has = Object.prototype.hasOwnProperty.call(awards, t.id);

      return {
        dotStyle:
          'width: 24px; height: 8px; border-radius: 999px; display: block; background: ' + t.color + ';' +
          (has ? '' : 'opacity: 0.28;'),
        value: has ? fmt(awards[t.id]) : '—',
        valueStyle:
          'font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums;' +
          (has ? 'color: oklch(0.145 0 0);' : 'color: oklch(0.556 0 0); font-weight: 500;'),
      };
    });

    return {
      teams: teams,
      rows: rows,
      preview: preview,
      isEmpty: s.groups.length === 0,
      reasoning: this.reasoningText(),

      x1Style: segStyle(s.multiplier === 1),
      x2Style: segStyle(s.multiplier === 2),
      setX1: () => self.commit({ multiplier: 1 }),
      setX2: () => self.commit({ multiplier: 2 }),

      tapLabel: s.tieArmed ? 'Tap every team that tied' : 'Tap in finish order',
      tapLabelStyle:
        'font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;' +
        (s.tieArmed ? 'color: oklch(0.145 0 0);' : 'color: oklch(0.556 0 0);'),
      tieArmLabel: s.tieArmed ? 'Done' : 'Tie',
      tieArmStyle:
        'height: 32px; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: 600;' +
        'display: inline-flex; align-items: center; gap: 5px;' +
        (s.tieArmed
          ? 'border: 1px solid oklch(0.145 0 0); background: oklch(0.205 0 0); color: oklch(0.985 0 0);'
          : 'border: 1px solid oklch(0.922 0 0); background: oklch(1 0 0); color: oklch(0.371 0 0);'),
      toggleTie: () => self.setState({ tieArmed: !s.tieArmed, tieInto: null }),

      clearStyle:
        'height: 30px; padding: 0 10px; border-radius: 9px; border: none; background: none; font-size: 13px; font-weight: 500;' +
        (s.groups.length > 0 ? 'color: oklch(0.556 0 0);' : 'color: oklch(0.922 0 0); cursor: default;'),
      clear: () => {
        if (s.groups.length === 0) return;
        self.commit({ groups: [], dq: [], bonus: {}, tieInto: null, tieArmed: false });
      },

      undoStyle:
        'height: 48px; padding: 0 15px; border-radius: 13px; font-size: 15px; font-weight: 600;' +
        'display: flex; align-items: center; gap: 7px;' +
        (canUndo
          ? 'border: 1px solid oklch(0.922 0 0); background: oklch(1 0 0); color: oklch(0.145 0 0);'
          : 'border: 1px solid oklch(0.97 0 0); background: oklch(1 0 0); color: oklch(0.922 0 0); cursor: default;'),
      undo: () => {
        if (!canUndo) return;
        const past = s.past.slice();
        const prev = past.pop();
        self.setState({
          groups: prev.groups, dq: prev.dq, bonus: prev.bonus,
          multiplier: prev.multiplier, past: past, tieInto: null,
        });
      },

      confirmLabel: blocking ? blocking : 'Confirm round',
      confirmStyle:
        'flex-grow: 1; height: 48px; border-radius: 13px; border: none; font-size: 16px; font-weight: 700;' +
        (blocking
          ? 'background: oklch(0.97 0 0); color: oklch(0.556 0 0); cursor: not-allowed;'
          : 'background: oklch(0.205 0 0); color: oklch(0.985 0 0);'),

      footnote: blocking
        ? 'Every team needs a place before this round can be sent.'
        : 'Nothing reaches the board until you confirm.',
    };
  }
}
