<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #f8fafc; } a:hover { color: #ffffff; }

    /*
      Every size is in vh, so the board fills whatever it is thrown at without
      clipping: a 16:9 TV, a 16:10 laptop driving a projector, or an older 4:3
      projector. Nothing is a fixed pixel value and nothing scrolls.
      BoardTV is this same layout in a 16:9 frame.
    */
    .board { width: 100%; height: 100%; display: grid; grid-template-rows: 11vh 1fr 6vh; background: #0b0f14; color: #f8fafc; overflow: hidden; }
    .head  { display: flex; align-items: center; justify-content: space-between; gap: 2vh; padding: 0 3vh; border-bottom: 1px solid rgba(248,250,252,0.08); min-width: 0; }
    .rows  { display: grid; grid-template-rows: repeat(4, minmax(0, 1fr)); }
    .row   { display: grid; grid-template-columns: 1.4vh 7vh minmax(0, 1fr) auto auto; align-items: center; border-bottom: 1px solid rgba(11,15,20,0.9); min-width: 0; }
    .bar   { height: 100%; }
    .rank  { font-size: 4.4vh; font-weight: 600; color: #94a3b8; text-align: center; font-variant-numeric: tabular-nums; }
    .name  { font-size: 6vh; font-weight: 700; letter-spacing: -0.01em; padding-left: 1.2vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .delta { display: flex; align-items: center; gap: 1vh; padding-right: 2.4vh; font-size: 2.9vh; font-weight: 600; white-space: nowrap; }
    .pts   { font-size: 16vh; font-weight: 800; line-height: 1; text-align: right; padding-right: 3vh; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
    .foot  { display: flex; align-items: center; padding: 0 3vh; border-top: 1px solid rgba(248,250,252,0.08); font-size: 2.3vh; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</helmet>

<div class="board">

  <div class="head">
    <div style="display: flex; align-items: baseline; gap: 2vh; min-width: 0;">
      <span style="font-size: 4.4vh; font-weight: 700; letter-spacing: -0.01em;">T&amp;T</span>
      <span style="font-size: 2.9vh; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Round 4 &middot; Baton Relay</span>
    </div>
    <div style="display: flex; align-items: center; gap: 1.2vh; flex-shrink: 0;">
      <span style="width: 1.5vh; height: 1.5vh; border-radius: 999px; background: #22c55e; display: block;"></span>
      <span style="font-size: 2.5vh; color: #94a3b8;">Live</span>
    </div>
  </div>

  <div class="rows">

    <div class="row" style="background: color-mix(in oklch, #2563eb, #0b0f14 84%);">
      <div class="bar" style="background: #2563eb;"></div>
      <div class="rank">1</div>
      <div class="name">Blue</div>
      <div class="delta" style="color: #22c55e;">
        <svg width="2.6vh" height="2.6vh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path></svg>
        <span>+35</span>
      </div>
      <div class="pts">145</div>
    </div>

    <div class="row" style="background: color-mix(in oklch, #facc15, #0b0f14 86%);">
      <div class="bar" style="background: #facc15;"></div>
      <div class="rank">2</div>
      <div class="name">Yellow</div>
      <div class="delta" style="color: #94a3b8;"><span>+20</span></div>
      <div class="pts">130</div>
    </div>

    <div class="row" style="background: color-mix(in oklch, #dc2626, #0b0f14 86%);">
      <div class="bar" style="background: #dc2626;"></div>
      <div class="rank">3</div>
      <div class="name">Red</div>
      <div class="delta" style="color: #ef4444;">
        <svg width="2.6vh" height="2.6vh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M19 12l-7 7-7-7"></path></svg>
        <span>+35</span>
      </div>
      <div class="pts">110</div>
    </div>

    <div class="row" style="background: color-mix(in oklch, #15803d, #0b0f14 84%); border-bottom: none;">
      <div class="bar" style="background: #15803d;"></div>
      <div class="rank">4</div>
      <div class="name">Green</div>
      <div class="delta" style="color: #94a3b8;"><span>+10</span></div>
      <div class="pts">95</div>
    </div>

  </div>

  <div class="foot">Round 4, Baton Relay: Red and Blue tied for 1st, 35 each.</div>

</div>
</x-dc>
</body>
</html>
